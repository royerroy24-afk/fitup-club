name: Meta Ads Daily Review & Optimization

on:
  schedule:
    # 8:00 AM hora de Perú (UTC-5) equivale exactamente a las 13:00 UTC
    - cron: '0 13 * * *'
  # Permite ejecutarlo manualmente en cualquier momento desde la pestaña "Acciones" (Actions)
  workflow_dispatch:

jobs:
  meta-ads-auditor:
    name: Meta Ads Cloud Reviewer (Cuenta 2301495497021946)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-dotenv

      - name: Ejecutar Auditoría Diaria y Optimización
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: 'act_2301495497021946'
          META_API_VERSION: 'v21.0'
        run: |
          python daily_reviewer.py

      - name: Guardar Reporte Generado como Artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-ads-daily-report
          path: reports/
          retention-days: 30
